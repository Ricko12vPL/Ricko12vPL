<style>
  .tm-bar { display: flex; justify-content: space-between; padding: 10px 20px; border-bottom: 1px solid var(--hair); }
  .tm-body { padding: 16px 20px 18px; font-size: 13px; line-height: 1.7; }
  .tm-step + .tm-step { margin-top: 14px; }
  .tm-cmd { color: var(--fg); }
  .tm-out { color: var(--fg-2); }
  .tm-row { display: flex; align-items: baseline; gap: 14px; }
  .tm-row .status, .tm-row .tm-key { width: 120px; flex: none; }
  .tm-key { font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em; }
  .tm-row .name { min-width: 0; color: var(--fg); text-decoration: underline; text-decoration-color: var(--fg-4); text-underline-offset: 4px; }
  .tm.narrow .tm-bar { padding: 12px 16px; }
  .tm.narrow .tm-body { padding: 16px 16px 18px; font-size: 15px; line-height: 1.6; }
  .tm.narrow .tm-step + .tm-step { margin-top: 16px; }
  .tm.narrow .tm-row { gap: 12px; }
  .tm.narrow .tm-row .status { width: 150px; }
  .tm.narrow .tm-key { font-size: 15px; }
  .tm.narrow .tm-row.stack { display: block; margin-top: 2px; }
  .tm.narrow .tm-row.stack .tm-key { display: block; width: auto; }
  .tm.narrow .tm-row.stack .name { display: inline; white-space: normal; }
</style>
<div class="card ticks tm {{mode}}">
  <div class="tm-bar"><span class="label">tty1 — {{user}}</span><span class="label">zsh</span></div>
  <div class="tm-body">
    <div class="tm-step">
      <div class="tm-cmd">{{{prompt}}} whoami</div>
      <div class="tm-out">{{tagline}}</div>
    </div>
    <div class="tm-step">
      <div class="tm-cmd">{{{prompt}}} ls ~/now</div>
      {{{nowRows}}}
    </div>
    <div class="tm-step"><div class="tm-cmd">{{{prompt}}}<span class="cursor"></span></div></div>
  </div>
</div>
