<style>
  .hd { padding: 0 0 22px; }
  .hd-bar { display: flex; align-items: center; justify-content: space-between; padding: 11px 20px; border-bottom: 1px solid var(--hair); }
  .hd-brand { display: inline-flex; align-items: baseline; gap: 10px; }
  .hd-mark { font-size: 20px; line-height: 1; color: var(--accent); }
  .hd-site { font-size: 12px; color: var(--fg-2); letter-spacing: 0.02em; }
  .hd-body { padding: 22px 20px 0; }
  .hd-word { margin: 0; font-size: 70px; line-height: 0.95; letter-spacing: -0.01em; color: var(--accent); }
  .hd-role { margin: 16px 0 0; font-size: 15px; color: var(--fg); }
  .hd-q { margin: 18px 0 0; font-size: 14px; line-height: 1.6; }
  .hd-q .q { color: var(--fg); }
  .hd-open { display: flex; align-items: baseline; gap: 10px; margin: 14px 0 0; padding-top: 14px; border-top: 1px dashed var(--hair); font-size: 12.5px; color: var(--fg-2); }
  .hd-open .dot { flex: none; width: 7px; height: 7px; background: var(--accent); transform: translateY(-1px); }
  .hd.narrow { padding-bottom: 18px; }
  .hd.narrow .hd-bar { padding: 12px 16px; }
  .hd.narrow .hd-bar .label { display: none; }
  .hd.narrow .hd-mark { font-size: 22px; }
  .hd.narrow .hd-site { font-size: 15px; }
  .hd.narrow .hd-body { padding: 18px 16px 0; }
  .hd.narrow .hd-word { font-size: 48px; }
  .hd.narrow .hd-role { margin-top: 14px; font-size: 15px; line-height: 22px; }
  .hd.narrow .hd-role .sep { display: none; }
  .hd.narrow .hd-loc { display: block; color: var(--fg-2); }
  .hd.narrow .hd-q { margin-top: 14px; font-size: 15px; line-height: 1.55; }
  .hd.narrow .hd-open { gap: 12px; margin-top: 14px; padding-top: 14px; font-size: 15px; line-height: 1.55; }
  .hd.narrow .hd-open .dot { width: 8px; height: 8px; }
</style>
<div class="card ticks hd {{mode}}">
  <div class="hd-bar">
    <span class="hd-brand"><span class="pixel hd-mark">KS</span><span class="hd-site">{{siteHost}}</span></span>
    <span class="label">{{login}} / README.md</span>
  </div>
  <div class="hd-body">
    <h1 class="pixel hd-word">{{wordmark}}</h1>
    <p class="hd-role">{{role}} <span class="sep">·</span> <span class="hd-loc">{{location}}</span></p>
    <p class="hd-q">{{{prompt}}} <span class="q">{{question}}</span><span class="cursor"></span></p>
    {{{openTo}}}
  </div>
</div>
