<style>
  .lk { display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12px; color: var(--fg); white-space: nowrap; }
  .lk-icon { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 16px; height: 16px; color: var(--accent); }
  .lk-icon svg { width: 16px; height: 16px; }
  .lk-icon .pixel { font-size: 14px; line-height: 1; }
  .lk-label { min-width: 0; overflow: hidden; text-overflow: clip; }
  .lk-hint { flex: none; margin-left: auto; color: var(--fg-3); font-size: 11px; letter-spacing: 0.06em; }
  .narrow .lk { gap: 12px; padding: 0 16px; font-size: 15px; }
  .narrow .lk-icon, .narrow .lk-icon svg { width: 20px; height: 20px; }
  .narrow .lk-icon .pixel { font-size: 18px; }
  .narrow .lk-hint { font-size: 15px; }
</style>
<div class="card ticks lk" style="height:{{height}}px"><span class="lk-icon">{{{icon}}}</span><span class="lk-label">{{label}}</span><span class="lk-hint">{{hint}}</span></div>
