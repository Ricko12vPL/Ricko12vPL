<style>
  .sec-row { position: absolute; top: 0; height: 20px; display: flex; align-items: flex-start; gap: 12px; }
  .sec-row h2 { margin: 0; flex: none; font-size: 12px; font-weight: 400; line-height: 20px; }
  .sec-rule { flex: 1; min-width: 24px; height: 1px; margin-top: 9px; background: var(--wire); }
  .sec-cmd { flex: none; font-size: 12px; line-height: 20px; color: var(--fg-3); }
  .narrow .sec-row { height: 24px; gap: 14px; }
  .narrow .sec-row h2 { font-size: 15px; line-height: 24px; }
  .narrow .sec-rule { margin-top: 11px; }
</style>
<div id="shot" class="frame {{mode}}" style="width:{{width}}px;height:{{height}}px">
  <div class="sec-row" style="left:{{inset}}px;right:{{inset}}px">
    <h2 class="label"><span class="accent">{{index}}</span> / {{name}}</h2>
    <span class="sec-rule"></span>
    {{{command}}}
  </div>
  {{{wires}}}
</div>
