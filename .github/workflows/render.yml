name: render profile

# Re-renders the README cards from https://kacpersaks.dev/profile.json.
# Fail closed: a fetch or validation error fails the job and nothing is committed.
on:
  schedule:
    - cron: '10 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-profile
  cancel-in-progress: false

jobs:
  render:
    if: github.repository == 'Ricko12vPL/Ricko12vPL'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: generator/package-lock.json

      - name: Install generator
        working-directory: generator
        run: npm ci

      - name: Install Chromium
        working-directory: generator
        run: npx playwright install --with-deps chromium

      - name: Test generator
        working-directory: generator
        run: npm test

      - name: Render
        working-directory: generator
        run: node render.mjs

      - name: Commit if changed
        run: |
          git add README.md assets
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: render profile from kacpersaks.dev/profile.json"
          git push
